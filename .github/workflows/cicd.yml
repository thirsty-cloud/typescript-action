name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows: ["ci.yml"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:

  deploy-dev:
    name: Dev Stage
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'dev'
    secrets: inherit

  deploy-uat:
    name: UAT Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'uat'
    secrets: inherit

  deploy-prod:
    name: Prod Stage
    needs: deploy-uat
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'prod'
    secrets: inherit
